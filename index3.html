<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCET Virtual Campus | 2D Integrated Tour</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <header id="tour-header">
        <div class="header-left">
            <img src="https://img.icons8.com/material-rounded/24/7c4dff/home.png" alt="home icon">
            <h1>SCET Virtual Campus</h1>
        </div>
        <button class="pill-button" onclick="viewer.loadScene('admin_gate')">Reset Tour</button>
    </header>

    <div id="panorama-container">
        <div id="panorama"></div>
        <div id="flashcard-container"></div>
    </div>

    <div id="map-block">
        <div id="map-wrapper">
            <img src="assets/images/map/scet-first-floor.jpg" 
                     alt="SCET First Floor Campus Map" 
                     id="campusMapImage"
                     style="width: 100%; height: auto; position: relative;">
            
            <div id="map-pointer"></div>
            
            <div class="map-region" style="top: 25%; left: 20%; width: 15%; height: 15%;" 
                 onclick="viewer.loadScene('co_inside')" title="Computer Engineering Department"></div>
            
            <div class="map-region" style="top: 20%; left: 60%; width: 15%; height: 15%;" 
                 onclick="viewer.loadScene('it_1')" title="Information Technology Department"></div>
            
            <div class="map-region" style="top: 45%; left: 40%; width: 15%; height: 15%;" 
                 onclick="viewer.loadScene('dome')" title="The Dome (Student Hub)"></div>
            
            <div class="map-region" style="top: 60%; left: 10%; width: 15%; height: 15%;" 
                 onclick="viewer.loadScene('admin_gate')" title="Main Entrance / Admin Gate"></div>
        </div>
    </div>

    <script src="script3.js"></script>
</body>
</html>
